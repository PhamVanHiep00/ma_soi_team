<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ Lý Chia Bài Ma Sói Realtime v3.2</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 20px auto; background: #162447; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 15px rgba(0,0,0,0.5); position: relative; }
        
        .admin-tool-icon { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; background: rgba(255, 255, 255, 0.1); padding: 5px 8px; border-radius: 50%; transition: 0.3s; }
        .admin-tool-icon:hover { background: rgba(255, 255, 255, 0.3); transform: rotate(45deg); }

        button { color: white; border: none; padding: 12px 20px; margin: 8px 0; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; box-sizing: border-box; }
        .btn-main { background: #e43f5a; }
        .btn-main:hover { background: #ff4a6e; }
        .btn-sub { background: #1f4068; border: 1px solid #e43f5a; }
        .btn-sub:hover { background: #244d7d; }
        
        button:disabled { background: #4a5568 !important; color: #a0aec0; cursor: not-allowed; border: none; }
        
        .btn-ready { background: #2ecc71; }
        .btn-ready:hover { background: #27ae60; }
        .btn-unready { background: #f39c12; }
        .btn-unready:hover { background: #d35400; }
        .btn-reset { background: #9b59b6; margin-top: 15px; }
        .btn-reset:hover { background: #8e44ad; }

        .player-list { list-style: none; padding: 0; text-align: left; background: #1f4068; border-radius: 5px; padding: 10px; margin: 15px 0; }
        .player-list li { padding: 10px; border-bottom: 1px solid #162447; display: flex; justify-content: space-between; align-items: center; }
        .player-list li:last-child { border-bottom: none; }
        
        .card-box { margin-top: 20px; padding: 20px; background: #222831; border-radius: 10px; display: none; text-align: left; border: 2px solid #e43f5a; box-sizing: border-box; }
        .card-title { font-size: 26px; font-weight: bold; text-align: center; margin-bottom: 10px; color: #ffca28; }
        .card-detail { font-size: 14px; line-height: 1.5; color: #eeeeee; background: #393e46; padding: 10px; border-radius: 5px; }
        
        .hidden { display: none; }
        .badge { padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; margin-left: 5px; }
        .badge-host { background: #e43f5a; color: #fff; }
        .badge-ready { background: #2ecc71; color: #fff; }
        .badge-waiting { background: #7f8c8d; color: #fff; }
        .badge-spec { background: #9b59b6; color: #fff; }
        .badge-hidden { background: #34495e; color: #bdc3c7; }
        
        input[type="text"], input[type="number"] { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #1f4068; background: #1a1a2e; color: #fff; font-size: 16px; box-sizing: border-box; }
        /* Xóa mũi tên tăng giảm của input number */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <div class="admin-tool-icon" onclick="promptAdminCode()" title="Kích hoạt chế độ Quản Trò">⚙️</div>

    <h2>🐺 Trợ Lý Ma Sói Realtime 🐺</h2>
    <p id="admin-status" style="color: #ffca28; font-size: 13px; margin-bottom: 20px;">Chế độ: Người chơi thông thường</p>
    
    <div id="screen-login">
        <h3 id="login-title">Cấu hình thông tin bàn chơi</h3>
        <input type="text" id="input-username" placeholder="Nhập tên hiển thị của bạn..." maxlength="15">
        <input type="number" id="input-room-id" placeholder="Nhập mã phòng (Gồm 4 chữ số)..." oninput="if(this.value.length>6) this.value=this.value.slice(0,6);">
        
        <button id="btn-join-existing" class="btn-main" onclick="handleJoinRoom(false)">Vào Phòng Có Sẵn 🚪</button>
        <div style="margin: 10px 0; color: #7f8c8d; font-size: 14px;">— HOẶC —</div>
        <button id="btn-create-new" class="btn-sub" onclick="handleJoinRoom(true)">Tự Tạo Phòng Mới ✨</button>
    </div>

    <div id="screen-room" class="hidden">
        <h3>Mã Phòng: <span id="room-id-display" style="color:#e43f5a;">xxxx</span></h3>
        <p id="room-state-text" style="font-style: italic; color: #aaa; font-size: 13px;"></p>
        
        <h4>Danh sách người trong bàn (<span id="player-count">0</span>):</h4>
        <ul id="player-list" class="player-list"></ul>

        <div id="player-controls">
            <button id="btn-ready-toggle" class="btn-ready" onclick="toggleReady()">SẴN SÀNG</button>
        </div>

        <div id="host-controls" class="hidden">
            <button id="btn-start-game" class="btn-ready" onclick="startDealingFirebase()" disabled>Bắt Đầu Game (Đợi mọi người sẵn sàng)</button>
            <button id="btn-reset-game" class="btn-reset hidden" onclick="resetGameFirebase()">CHƠI VÁN MỚI 🔄</button>
        </div>

        <hr style="border: 0; border-top: 1px dashed #444; margin: 20px 0;">

        <div id="player-card-area" class="hidden">
            <button id="btn-view-card" class="btn-main"
                    onmousedown="showCard()" onmouseup="hideCard()" 
                    ontouchstart="showCard()" ontouchend="hideCard()">
                NHẤN GIỮ ĐỂ XEM LÁ BÀI CỦA BẠN
            </button>
            
            <div id="card-display" class="card-box">
                <div class="card-title" id="display-role-name">Chưa chia bài</div>
                <div class="card-detail" id="display-role-desc">Hệ thống đang xáo bài...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD7fclfpNYEccgFuQKmtmOzXjEEOap3GoI",
        authDomain: "masoi123.firebaseapp.com",
        databaseURL: "https://masoi123-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "masoi123",
        storageBucket: "masoi123.firebasestorage.app",
        messagingSenderId: "23602056766",
        appId: "1:23602056766:web:f9703aea3cae1a52598b6f",
        measurementId: "G-78LL2K5VCL"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const SECRET_ADMIN_CODE = "admin123"; 
    let isAdminActive = false; 

    let currentRoomId = "";
    let myPlayerId = "";
    let isHost = false;
    let myCurrentState = "waiting"; 

    const roleDictionary = {
        "wolf": { name: "Ma Sói 🐺", isWolfPhe: true, desc: "<b>• Phe:</b> Ma Sói<br>• Đêm xuống, cùng đồng bọn dậy cắn một người. Ban ngày tìm cách ẩn mình bao che cho nhau." },
        "wolf_kid": { name: "Sói Con 🐾", isWolfPhe: true, desc: "<b>• Phe:</b> Ma Sói<br>• Ban đêm dậy cắn người cùng đàn Sói. Đặc biệt: Nếu Sói Con chết, đêm tiếp theo đàn Sói được cắn 2 người liên tiếp." },
        "seer": { name: "Tiên Tri 🔮", isWolfPhe: false, desc: "<b>• Phe:</b> Dân làng<br>• Mỗi đêm thức giấc chọn 1 người để soi danh tính xem họ thuộc phe Dân hay phe Sói." },
        "guard": { name: "Bảo Vệ 🛡️", isWolfPhe: false, desc: "<b>• Phe:</b> Dân làng<br>• Mỗi đêm chọn bảo vệ 1 người khỏi Sói cắn. Không được bảo vệ 1 người 2 đêm liên tiếp." },
        "witch": { name: "Phù Thủy 🧪", isWolfPhe: false, desc: "<b>• Phe:</b> Dân làng<br>• Sở hữu 1 bình Cứu người và 1 bình Độc. Mỗi bình chỉ dùng được 1 lần duy nhất suốt trận đấu." },
        "hunter": { name: "Thợ Săn 🏹", isWolfPhe: false, desc: "<b>• Phe:</b> Dân làng<br>• Nếu Thợ Săn bị chết ban đêm hoặc bị treo cổ ban ngày, lập tức được chọn bắn chết thêm 1 người khác." },
        "cupid": { name: "Thần Tình Yêu 💘", isWolfPhe: false, desc: "<b>• Phe:</b> Dân làng (Hoặc Thứ 3)<br>• Đêm đầu ghép đôi 2 người. Nếu 2 người khác phe (1 Dân 1 Sói), bạn và họ biến thành phe Thứ 3 cần giết sạch làng để thắng." },
        "elder": { name: "Già Làng 👴", isWolfPhe: false, desc: "<b>• Phe:</b> Dân làng<br>• Có 2 mạng trước Sói cắn. Nếu Già Làng bị Dân treo cổ hoặc Phù thủy độc chết, tất cả chức năng Dân khác mất hết năng lực." },
        "half_wolf": { name: "Bán Sói 🌗", isWolfPhe: false, desc: "<b>• Phe:</b> Linh hoạt<br>• Ban đầu là Dân Làng. Nếu bị Sói cắn trúng ban đêm, bạn không chết mà biến thành Sói từ đêm hôm sau." },
        "idiot": { name: "Chàng Ngốc 🤡", isWolfPhe: false, desc: "<b>• Phe:</b> Dân làng<br>• Nếu bị bỏ phiếu treo cổ ban ngày, bạn lật bài để được tha bổng, vẫn sống nhưng mất quyền bỏ phiếu về sau." },
        "villager": { name: "Dân Làng 🧑‍🌾", isWolfPhe: false, desc: "<b>• Phe:</b> Dân làng<br>• Đêm đi ngủ, ngày tích cực thảo luận, biểu quyết treo cổ kẻ tình nghi." }
    };

    // Kiểm tra link mời điều hướng tự động
    const urlParams = new URLSearchParams(window.location.search);
    const roomIdParam = urlParams.get('room');

    if (roomIdParam) {
        document.getElementById("input-room-id").value = roomIdParam;
        document.getElementById("login-title").innerText = "Bạn nhận được lời mời vào phòng: " + roomIdParam;
    }

    function handleJoinRoom(isCreatingNew) {
        const username = document.getElementById("input-username").value.trim();
        let roomIdInput = document.getElementById("input-room-id").value.trim();

        if (!username) {
            alert("Vui lòng nhập tên hiển thị trước!");
            return;
        }

        myPlayerId = "p_" + Math.random().toString(36).substr(2, 9);

        if (isCreatingNew) {
            // HÀNH ĐỘNG TẠO PHÒNG MỚI
            currentRoomId = Math.floor(1000 + Math.random() * 9000).toString();
            isHost = true;
            myCurrentState = "ready";

            const userRef = database.ref('rooms/' + currentRoomId + '/players/' + myPlayerId);
            userRef.onDisconnect().remove();

            database.ref('rooms/' + currentRoomId).set({
                status: "waiting",
                hostId: myPlayerId,
                players: {
                    [myPlayerId]: { name: username, state: "ready", roleKey: "", isHost: true }
                }
            }).then(() => {
                window.history.pushState({}, '', '?room=' + currentRoomId);
                initRoomListener();
            });
        } else {
            // HÀNH ĐỘNG TRUY CẬP VÀO SỐ PHÒNG CÓ SẴN
            if (!roomIdInput) {
                alert("Vui lòng nhập số phòng muốn tham gia!");
                return;
            }
            currentRoomId = roomIdInput;

            database.ref('rooms/' + currentRoomId).once('value', (snapshot) => {
                const roomData = snapshot.val();
                
                if (!roomData) {
                    alert("Phòng số " + currentRoomId + " không tồn tại hoặc đã bị hủy! Hãy bấm nút Tạo Phòng Mới.");
                    return;
                }

                if (roomData.status === "playing") {
                    myCurrentState = "spectator";
                    alert("Phòng đang đấu giữa chừng! Bạn sẽ tham gia với tư cách Khán giả xem bài.");
                } else {
                    myCurrentState = "waiting";
                }

                // Nếu phòng cũ bị mất Host vì lý do gì đó, người vào đầu tiên nhận lại quyền Host
                if (!roomData.players || Object.keys(roomData.players).length === 0) {
                    isHost = true;
                    myCurrentState = "ready";
                } else {
                    isHost = false;
                }

                const userRef = database.ref('rooms/' + currentRoomId + '/players/' + myPlayerId);
                userRef.onDisconnect().remove();

                userRef.set({
                    name: username,
                    state: myCurrentState,
                    roleKey: "",
                    isHost: isHost
                }).then(() => {
                    window.history.pushState({}, '', '?room=' + currentRoomId);
                    initRoomListener();
                });
            });
        }
    }

    function toggleReady() {
        if (isHost || myCurrentState === "spectator") return;

        const btn = document.getElementById("btn-ready-toggle");
        if (myCurrentState === "waiting") {
            myCurrentState = "ready";
            btn.innerText = "HỦY SẴN SÀNG";
            btn.className = "btn-unready";
        } else {
            myCurrentState = "waiting";
            btn.innerText = "SẴN SÀNG";
            btn.className = "btn-ready";
        }
        database.ref('rooms/' + currentRoomId + '/players/' + myPlayerId + '/state').set(myCurrentState);
    }

    function renderPlayerListUI(data) {
        const playerListUl = document.getElementById("player-list");
        playerListUl.innerHTML = "";
        
        let totalCount = 0;
        let activePlayersCount = 0; 
        let readyCount = 0;

        if (data.players) {
            Object.keys(data.players).forEach((key) => {
                totalCount++;
                const p = data.players[key];
                
                let li = document.createElement("li");
                li.innerText = p.name;

                let badgeGroup = document.createElement("div");

                if (p.isHost) {
                    let b = document.createElement("span"); b.className = "badge badge-host"; b.innerText = "Chủ Bàn"; badgeGroup.appendChild(b);
                    activePlayersCount++;
                } else if (p.state === "spectator") {
                    let b = document.createElement("span"); b.className = "badge badge-spec"; b.innerText = "Khán Giả"; badgeGroup.appendChild(b);
                } else {
                    activePlayersCount++;
                    if (p.state === "ready") readyCount++;

                    let b = document.createElement("span");
                    b.className = p.state === "ready" ? "badge badge-ready" : "badge badge-waiting";
                    b.innerText = p.state === "ready" ? "Sẵn Sàng" : "Chưa Sẵn Sàng";
                    badgeGroup.appendChild(b);
                }

                if (data.status === "playing" && p.roleKey) {
                    let bRole = document.createElement("span");
                    bRole.className = "badge";
                    if (isAdminActive) {
                        bRole.innerText = roleDictionary[p.roleKey].name;
                        bRole.style.color = roleDictionary[p.roleKey].isWolfPhe ? "#ff4a6e" : "#64b5f6";
                    } else {
                        bRole.innerText = "[ 🔒 ]";
                        bRole.classList.add("badge-hidden");
                    }
                    badgeGroup.appendChild(bRole);
                }

                li.appendChild(badgeGroup);
                playerListUl.appendChild(li);
            });
        }

        document.getElementById("player-count").innerText = totalCount;

        if (data.status === "waiting") {
            document.getElementById("room-state-text").innerText = `Đang đợi mọi người tập hợp. (Hiện tại: ${readyCount}/${activePlayersCount - 1} sẵn sàng)`;
            document.getElementById("player-card-area").classList.add("hidden");
            
            if (myCurrentState === "spectator") {
                myCurrentState = "waiting";
                const btnReady = document.getElementById("btn-ready-toggle");
                btnReady.classList.remove("hidden");
                btnReady.innerText = "SẴN SÀNG";
                btnReady.className = "btn-ready";
            }

            if (isHost) {
                document.getElementById("btn-start-game").classList.remove("hidden");
                document.getElementById("btn-reset-game").classList.add("hidden");

                const allReady = (readyCount === (activePlayersCount - 1)) && (activePlayersCount >= 4);
                document.getElementById("btn-start-game").disabled = !allReady;
                if(activePlayersCount < 4) {
                    document.getElementById("btn-start-game").innerText = "Cần tối thiểu 4 người để chơi";
                } else {
                    document.getElementById("btn-start-game").innerText = allReady ? "Bốc Bài & Bắt Đầu Game" : "Đợi mọi người Sẵn Sàng...";
                }
            }
        } else if (data.status === "playing") {
            document.getElementById("room-state-text").innerText = "Trận đấu đang diễn ra! Phòng đã khóa đăng ký mới.";
            
            if (isHost) {
                document.getElementById("btn-start-game").classList.add("hidden");
                document.getElementById("btn-reset-game").classList.remove("hidden");
            }
            
            if (data.players[myPlayerId] && data.players[myPlayerId].state !== "spectator") {
                document.getElementById("player-card-area").classList.remove("hidden");
                const myRoleKey = data.players[myPlayerId].roleKey;
                if (myRoleKey) {
                    document.getElementById("display-role-name").innerHTML = roleDictionary[myRoleKey].name;
                    document.getElementById("display-role-desc").innerHTML = roleDictionary[myRoleKey].desc;
                    document.getElementById("card-display").style.borderColor = roleDictionary[myRoleKey].isWolfPhe ? "#ff4a6e" : "#00bcd4";
                }
            } else {
                document.getElementById("player-card-area").classList.add("hidden");
            }
        }
    }

    function initRoomListener() {
        document.getElementById("screen-login").classList.add("hidden");
        document.getElementById("screen-room").classList.remove("hidden");
        document.getElementById("room-id-display").innerText = currentRoomId;

        if (isHost) {
            document.getElementById("host-controls").classList.remove("hidden");
            document.getElementById("player-controls").classList.add("hidden"); 
        } else {
            document.getElementById("host-controls").classList.add("hidden");
            document.getElementById("player-controls").classList.remove("hidden"); 
        }

        database.ref('rooms/' + currentRoomId).on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            if (!data.players || Object.keys(data.players).length === 0) {
                database.ref('rooms/' + currentRoomId).remove();
                return;
            }
            renderPlayerListUI(data);
        });
    }

    function startDealingFirebase() {
        database.ref('rooms/' + currentRoomId + '/players').once('value', (snapshot) => {
            const players = snapshot.val();
            if (!players) return;

            const activePlayerIds = Object.keys(players).filter(id => players[id].state === "ready" || players[id].isHost);
            const totalPlayers = activePlayerIds.length;

            let rolesPool = [];
            let wolfCount = 1;
            if (totalPlayers >= 6 && totalPlayers <= 9) wolfCount = 2;
            if (totalPlayers >= 10) wolfCount = 3;

            if (wolfCount === 1) {
                rolesPool.push("wolf");
            } else if (wolfCount === 2) {
                if (Math.random() > 0.5) rolesPool.push("wolf", "wolf_kid");
                else rolesPool.push("wolf", "wolf");
            } else {
                rolesPool.push("wolf", "wolf", "wolf_kid");
            }

            let godRoles = ["seer", "guard", "witch", "hunter", "cupid", "elder", "half_wolf", "idiot"];
            for (let i = godRoles.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [godRoles[i], godRoles[j]] = [godRoles[j], godRoles[i]];
            }

            if (totalPlayers <= 5) {
                rolesPool.push("seer", "guard");
                if (totalPlayers === 5) rolesPool.push("witch");
            } else {
                rolesPool.push("seer");
                let desiredGodCount = 3;
                if (totalPlayers >= 8) desiredGodCount = 4;
                if (totalPlayers >= 10) desiredGodCount = 5;

                while (rolesPool.filter(r => r !== "wolf" && r !== "wolf_kid").length < desiredGodCount) {
                    let nextGod = godRoles.pop();
                    if (nextGod && nextGod !== "seer") rolesPool.push(nextGod);
                }
            }

            while (rolesPool.length < totalPlayers) {
                rolesPool.push("villager");
            }

            for (let i = rolesPool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [rolesPool[i], rolesPool[j]] = [rolesPool[j], rolesPool[i]];
            }

            let updates = {};
            activePlayerIds.forEach((id, index) => {
                updates['rooms/' + currentRoomId + '/players/' + id + '/roleKey'] = rolesPool[index];
            });
            updates['rooms/' + currentRoomId + '/status'] = "playing";

            database.ref().update(updates).then(() => {
                alert(`🎉 Khởi trận thành công! Bàn gồm ${totalPlayers} người đã được chia bài ngẫu nhiên.`);
            });
        });
    }

    function resetGameFirebase() {
        if (!confirm("Bạn có chắc chắn muốn kết thúc ván để chơi trận mới?")) return;

        database.ref('rooms/' + currentRoomId + '/players').once('value', (snapshot) => {
            const players = snapshot.val();
            if (!players) return;

            let updates = {};
            Object.keys(players).forEach((id) => {
                updates['rooms/' + currentRoomId + '/players/' + id + '/roleKey'] = "";
                updates['rooms/' + currentRoomId + '/players/' + id + '/state'] = players[id].isHost ? "ready" : "waiting";
            });
            updates['rooms/' + currentRoomId + '/status'] = "waiting";

            database.ref().update(updates).then(() => {
                alert("🔄 Phòng đã được thiết lập lại về trạng thái chờ!");
            });
        });
    }

    function promptAdminCode() {
        let codeInput = prompt("Nhập mã Quản Trò để bật Mắt Thần:");
        if (codeInput === SECRET_ADMIN_CODE) {
            isAdminActive = true;
            document.getElementById("admin-status").innerText = "👁️ CHẾ ĐỘ QUẢN TRÒ: BẬT";
            document.getElementById("admin-status").style.color = "#2ecc71";
            alert("Bật mắt thần quản trò thành công!");
        } else {
            isAdminActive = false;
            document.getElementById("admin-status").innerText = "Chế độ: Người chơi thông thường";
            document.getElementById("admin-status").style.color = "#ffca28";
            alert("Mã sai, chế độ quản trò đã tắt.");
        }
        
        if (currentRoomId) {
            database.ref('rooms/' + currentRoomId).once('value', (snapshot) => {
                const data = snapshot.val();
                if (data) renderPlayerListUI(data); 
            });
        }
    }

    function showCard() { document.getElementById("card-display").style.display = "block"; }
    function hideCard() { document.getElementById("card-display").style.display = "none"; }
</script>
